name: mom_app
description: منبّه الوالدة — أدوية وصلاة وقيام وأذكار، مع متابعة من تليفون الابن.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  alarm: ^4.1.1
  android_alarm_manager_plus: ^4.0.4
  audioplayers: ^6.1.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  flutter_local_notifications: ^18.0.1
  flutter_tts: ^4.0.2
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  timezone: '>=0.9.4 <0.11.0'

flutter:
  uses-material-design: true
  # Any audio file dropped into these folders is picked up automatically;
  # a file named main_* is that category's default.
  assets:
    - assets/sounds/adhan/
    - assets/sounds/alarm/
    - assets/sounds/med/
    - assets/sounds/tasbeeh/
    - assets/sounds/azkar_morning/
    - assets/sounds/azkar_evening/
