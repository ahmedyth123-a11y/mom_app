name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: Generate Android scaffolding
        run: flutter create --platforms=android --org com.zord --project-name mom_app .

      - name: Apply our Android customizations
        run: python3 tool/patch_android.py

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk mom_app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mom_app-apk
          path: mom_app.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخة ${{ github.run_number }}
          body: نزّل ملف mom_app.apk من تحت وسطّبه على التليفون.
          files: mom_app.apk
          make_latest: true
